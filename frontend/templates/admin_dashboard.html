<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Enterprise Catalog Intelligence - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">

</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <h2 class="fw-bold">
        Enterprise Catalog Intelligence
    </h2>

    <p class="text-muted">
        Admin Dashboard
    </p>

    <!-- Metrics -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">
            <div class="metric-card">
                <h6>Total Products</h6>
                <h3 id="totalProducts">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="metric-card">
                <h6>Embeddings</h6>
                <h3 id="totalEmbeddings">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="metric-card">
                <h6>Review Queue</h6>
                <h3 id="reviewCount">--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="metric-card">
                <h6>Model Accuracy</h6>
                <h3 id="accuracy">--</h3>
            </div>
        </div>

    </div>

    <!-- Review Queue -->

    <div class="card shadow-sm">

        <div class="card-header fw-bold">

            Review Queue

        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>Product</th>

                    <th>Category</th>

                    <th>Reason</th>

                    <th>Confidence</th>

                    <th>Duplicate</th>

                    <th>Date</th>
                    
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="reviewTable">

                </tbody>

            </table>

        </div>

    </div>

    <hr class="my-5">

    <div class="row">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5 class="mb-3">
                        Category Distribution
                    </h5>

                    <div style="height:300px;">
                        <canvas id="categoryChart"></canvas>
                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5 class="mb-3">
                        Review Queue Reasons
                    </h5>

                    <div style="height:300px;">
                        <canvas id="reasonChart"></canvas>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{{ url_for('static', filename='admin.js') }}"></script>

</body>

</html>
